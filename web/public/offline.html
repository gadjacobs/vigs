<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
<title>Vig: offline</title>
<style>
  body { margin: 0; min-height: 100vh; background: #0c2a20; color: #eef3ea; font-family: system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; }
  .mark { font-weight: 800; font-size: 32px; margin: 0 0 8px; color: #f6c945; }
  p { color: #a8bdb0; line-height: 1.5; }
  button { min-height: 44px; padding: 10px 18px; border-radius: 3px; border: 0; background: #f6c945; color: #0c2a20; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
<main>
  <p class="mark">Vig</p>
  <h1>You're offline</h1>
  <p>Vig needs a connection for live odds and codes. It will load again as soon as you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
