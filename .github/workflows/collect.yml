name: Collect vFootball data

# Polls SportyBet every 4 minutes for pre-match odds (published only for the
# next round) and results, and commits them to the `data` branch.
# Each run lasts just under 6 hours. GitHub delays scheduled runs, sometimes by
# hours (18:17 started at 21:58 on 11 Oct), so the schedule fires every 30
# minutes: with the concurrency group below, the newest trigger waits as the one
# pending run and starts the moment the current run ends, so runs follow each
# other back to back. Superseded pending runs show as cancelled; they cost nothing.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      chunks:
        description: "Number of 55-minute collection chunks"
        default: "6"

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      HAS_STORE: ${{ secrets.REDIS_URL != '' || secrets.UPSTASH_REDIS_REST_TOKEN != '' }}
    steps:
      - run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node runs the background pass here (web/tools/tick.mts) when a REDIS_URL
      # secret is set, so it uses GitHub's CPU rather than the web host's.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/web/package-lock.json

      - name: Install the web app's packages
        if: env.HAS_STORE == 'true'
        working-directory: code/web
        run: npm ci --no-audit --no-fund

      - name: Check out the data branch
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if ! git clone -q --depth 1 --branch data "$REPO_URL" store; then
            mkdir store
            git -C store init -q -b data
            git -C store remote add origin "$REPO_URL"
          fi
          git -C store config user.name "github-actions[bot]"
          git -C store config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect
        env:
          # Optional: push notifications (see README "Notifications").
          # Either may be saved as a variable or a secret.
          PUSH_TICK_URL: ${{ vars.PUSH_TICK_URL || secrets.PUSH_TICK_URL }}
          PUSH_TICK_SECRET: ${{ secrets.PUSH_TICK_SECRET || vars.PUSH_TICK_SECRET }}
          # The store, so the pass runs here: the same REDIS_URL as the web app's
          # (Netlify). VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY only if the web app
          # has the same pair; leave both unset in both places to share the
          # keys kept in the store.
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Or Upstash's REST pair, the same two values as the web app's.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # The background tick has its own workflow (tick.yml), which never has
          # a gap between runs; the collector no longer runs one.
          TICK_ELSEWHERE: "1"
        run: code/tools/collect.sh store "${{ inputs.chunks || '6' }}"

      # GitHub starts scheduled runs late (gaps of two to three hours most days),
      # so a run that finished normally starts the next one itself: a dispatch
      # starts within seconds. The schedule stays as the safety net.
      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only after a full-length run, so a run that ends early can never loop.
          if [ $(( $(date +%s) - RUN_START )) -ge 1800 ]; then
            gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || true
          else
            echo "Run ended early; leaving the next start to the schedule."
          fi
